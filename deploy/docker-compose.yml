services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: spot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spot}
      POSTGRES_DB: ${POSTGRES_DB:-spot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-spot} -d ${POSTGRES_DB:-spot}']
      interval: 10s
      timeout: 5s
      retries: 10
    # 只在宿主机调试时暴露，生产可注释掉
    ports:
      - '127.0.0.1:5432:5432'

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: spot-api
    restart: unless-stopped
    # 只想本地起数据库时不需要 deploy/.env，缺省账号是 spot/spot/spot
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-spot}:${POSTGRES_PASSWORD:-spot}@postgres:5432/${POSTGRES_DB:-spot}
      LOCAL_STORAGE_DIR: /app/var/uploads
    volumes:
      - uploads:/app/var/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # 启动前自动跑迁移，避免忘记执行
    command: sh -c "node dist/database/run-migrations.js && node dist/main.js"

  nginx:
    image: nginx:1.27-alpine
    container_name: spot-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - uploads:/var/www/uploads:ro
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
